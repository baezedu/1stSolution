# Cloudflare Tunnel Configuration Example
# Copy this file to config.yml and update with your values
# Location: 
#   Windows: C:\Users\<username>\.cloudflared\config.yml
#   Linux: /etc/cloudflared/config.yml or ~/.cloudflared/config.yml

# Replace <TUNNEL-ID> with your actual tunnel ID from: cloudflared tunnel create
tunnel: <TUNNEL-ID>

# Replace with the path to your credentials file
credentials-file: /path/to/.cloudflared/<TUNNEL-ID>.json

# Ingress rules - order matters!
ingress:
  # Route for SQL Server
  # Replace sqlserver.tudominio.com with your actual domain
  - hostname: sqlserver.tudominio.com
    service: tcp://localhost:1433
    # If your SQL Server uses a different port, change 1433 to your port
    # Example: service: tcp://localhost:1401
  
  # Route for the Blazor web application (optional)
  # Replace app.tudominio.com with your actual domain
  - hostname: app.tudominio.com
    service: http://localhost:5000
    # Add these options for Blazor Server with SignalR:
    originRequest:
      noTLSVerify: false
      connectTimeout: 30s
      tlsTimeout: 10s
      keepAliveConnections: 100
      keepAliveTimeout: 90s
  
  # Alternative: HTTPS if your app uses HTTPS locally
  # - hostname: app.tudominio.com
  #   service: https://localhost:5001
  
  # Catch-all rule (required, must be last)
  - service: http_status:404

# Optional: Logging configuration
# Uncomment to enable detailed logging for troubleshooting
# loglevel: debug
# logfile: /var/log/cloudflared.log

# Optional: Metrics server for monitoring
# metrics: localhost:2000

# Optional: Auto-update configuration
# no-autoupdate: false

# Optional: Protocol optimization
# protocol: quic  # or http2, h2mux (default: auto)
