# Nginx Configuration for DOGO2 Blazor Application
# Location: /etc/nginx/sites-available/dogo2
# Create symlink: sudo ln -s /etc/nginx/sites-available/dogo2 /etc/nginx/sites-enabled/

# Map for WebSocket upgrade header
map $http_upgrade $http_connection {
    default upgrade;
    ''      close;
}

# Redirect HTTP to HTTPS (recommended for production)
server {
    listen 80;
    listen [::]:80;
    server_name app.tudominio.com;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.tudominio.com;

    # SSL Certificate paths (update with your certificate paths)
    # You can use Let's Encrypt certificates
    ssl_certificate /etc/ssl/certs/app.tudominio.com.crt;
    ssl_certificate_key /etc/ssl/private/app.tudominio.com.key;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Logging
    access_log /var/log/nginx/dogo2_access.log;
    error_log /var/log/nginx/dogo2_error.log;
    
    # Max upload size
    client_max_body_size 50M;
    
    # Proxy settings for Blazor Server
    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        
        # WebSocket support (required for Blazor Server SignalR)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Disable buffering for SignalR
        proxy_buffering off;
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts (important for long-running connections)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 75s;
    }
    
    # Static files caching (optional optimization)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache static files
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

